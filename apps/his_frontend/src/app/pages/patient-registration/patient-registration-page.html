<div id="patient-registration-page" class="his-page">
  <app-page-header
    id="patient-registration-app-page-header"
    [title]="mode() === 'edit' ? 'Edycja danych pacjenta' : 'Rejestracja pacjenta'"
  />

  @if (mode() === 'edit' && loadingPatient()) {
    <div id="patient-registration-card" class="his-card">Ładowanie danych pacjenta...</div>
  } @else {
    <p-stepper id="patient-registration-p-stepper" [(value)]="activeStep" [linear]="true">
      <p-step-list id="patient-registration-p-step-list">
        <p-step id="patient-registration-p-step" [value]="1">Identyfikacja</p-step>
        <p-step id="patient-registration-p-step-2" [value]="2">Dane osobowe</p-step>
        <p-step id="patient-registration-p-step-3" [value]="3">Ubezpieczenie</p-step>
        @if (mode() === 'create') {
          <p-step id="patient-registration-p-step-4" [value]="4">Przyjęcie</p-step>
        } @else {
          <p-step id="patient-registration-p-step-5" [value]="4">Zmiany</p-step>
        }
        <p-step id="patient-registration-p-step-6" [value]="5">Podsumowanie</p-step>
      </p-step-list>

      <p-step-panels id="patient-registration-p-step-panels">
        <!-- Step 1: Identyfikacja -->
        <p-step-panel id="patient-registration-p-step-panel" [value]="1">
          <ng-template #content let-activateCallback="activateCallback">
            <app-registration-identity-step
              id="patient-registration-app-registration-identity-step"
              [form]="step1"
              [duplicate]="duplicatePatient()"
            />
            <app-wizard-step-footer
              id="patient-registration-app-wizard-step-footer"
              [first]="true"
              (next)="tryAdvanceStep1(activateCallback)"
              (cancelled)="cancel()"
            />
          </ng-template>
        </p-step-panel>

        <!-- Step 2: Dane osobowe i kontaktowe -->
        <p-step-panel id="patient-registration-p-step-panel-2" [value]="2">
          <ng-template #content let-activateCallback="activateCallback">
            <app-registration-personal-step
              id="patient-registration-app-registration-personal-step"
              [form]="step2"
            />
            <app-wizard-step-footer
              id="patient-registration-app-wizard-step-footer-2"
              (back)="activateCallback(1)"
              (next)="tryAdvanceStep2(activateCallback)"
              (cancelled)="cancel()"
            />
          </ng-template>
        </p-step-panel>

        <!-- Step 3: Ubezpieczenie i osoba kontaktowa -->
        <p-step-panel id="patient-registration-p-step-panel-3" [value]="3">
          <ng-template #content let-activateCallback="activateCallback">
            <app-registration-insurance-step
              id="patient-registration-app-registration-insurance-step"
              [form]="step3"
              [guardianRequired]="guardianRequired()"
              (verifyEwus)="verifyEwus()"
            />
            <app-wizard-step-footer
              id="patient-registration-app-wizard-step-footer-3"
              (back)="activateCallback(2)"
              (next)="tryAdvanceStep3(activateCallback)"
              (cancelled)="cancel()"
            />
          </ng-template>
        </p-step-panel>

        <!-- Step 4: Przyjęcie / Zmiany -->
        <p-step-panel id="patient-registration-p-step-panel-4" [value]="4">
          <ng-template #content let-activateCallback="activateCallback">
            @if (mode() === 'create') {
              <app-registration-admission-step
                id="patient-registration-app-registration-admission-step"
                [form]="step4"
                [ambulatoryOnly]="isAmbulatoryOnly()"
                [wards]="wards()"
                [doctors]="doctors()"
              />
            } @else {
              <div id="patient-registration-card-2" class="his-card">
                <app-registration-summary
                  id="patient-registration-app-registration-summary"
                  [sections]="summarySections()"
                />
              </div>
            }
            <app-wizard-step-footer
              id="patient-registration-app-wizard-step-footer-4"
              (back)="activateCallback(3)"
              (next)="tryAdvanceStep4(activateCallback)"
              (cancelled)="cancel()"
            />
          </ng-template>
        </p-step-panel>

        <!-- Step 5: Podsumowanie -->
        <p-step-panel id="patient-registration-p-step-panel-5" [value]="5">
          <ng-template #content let-activateCallback="activateCallback">
            <app-registration-summary
              id="patient-registration-app-registration-summary-2"
              [sections]="summarySections()"
            />
            <app-wizard-step-footer
              id="patient-registration-app-wizard-step-footer-5"
              [last]="true"
              [submitLabel]="mode() === 'edit' ? 'Zapisz zmiany' : 'Zarejestruj pacjenta'"
              [busy]="submitting()"
              (back)="activateCallback(4)"
              (submitted)="submit()"
              (cancelled)="cancel()"
            />
          </ng-template>
        </p-step-panel>
      </p-step-panels>
    </p-stepper>
  }
</div>
