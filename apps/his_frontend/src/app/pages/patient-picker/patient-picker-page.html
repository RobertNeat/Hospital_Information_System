<div class="his-page">
  <app-page-header title="Wybór pacjenta" subtitle="Wyszukaj pacjenta, aby przejść do jego karty" />

  <div class="his-card">
    <app-patient-search (patientSelected)="goTo($event)" />
  </div>

  <div class="his-card">
    <h3>Ostatnio przeglądani pacjenci</h3>
    @if (ctx.recentPatients().length === 0) {
      <app-empty-state icon="pi pi-users" title="Brak ostatnio przeglądanych pacjentów" />
    } @else {
      <ul class="his-patient-picker__recent">
        @for (p of ctx.recentPatients(); track p.id) {
          <li>
            <button type="button" (click)="goTo(p)">
              <span>{{ p | fullName }}</span>
              <span class="his-muted">{{ p.pesel ?? 'brak PESEL' }} · {{ p.birthDate | age }}</span>
            </button>
          </li>
        }
      </ul>
    }
  </div>
</div>
