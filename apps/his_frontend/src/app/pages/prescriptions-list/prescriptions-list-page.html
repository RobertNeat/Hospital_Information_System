<div id="prescriptions-list-page" class="his-page">
  <app-page-header
    id="prescriptions-list-app-page-header"
    title="Recepty"
    subtitle="Recepty wystawione przez Ciebie"
  />

  <div id="prescriptions-list-toolbar" class="his-toolbar">
    <p-select
      id="prescriptions-list-p-select"
      [ngModel]="statusFilter()"
      (ngModelChange)="statusFilter.set($event)"
      [options]="statusOptions"
      optionLabel="label"
      optionValue="value"
      placeholder="Status"
      [showClear]="true"
      ariaLabel="Filtruj według statusu"
    />
    <p-datepicker
      id="prescriptions-list-p-datepicker"
      [ngModel]="dateFrom()"
      (ngModelChange)="dateFrom.set($event)"
      dateFormat="dd.mm.yy"
      placeholder="Data od"
      [showIcon]="true"
      ariaLabel="Data od"
    />
    <p-datepicker
      id="prescriptions-list-p-datepicker-2"
      [ngModel]="dateTo()"
      (ngModelChange)="dateTo.set($event)"
      dateFormat="dd.mm.yy"
      placeholder="Data do"
      [showIcon]="true"
      ariaLabel="Data do"
    />
  </div>

  @if (!loading() && filteredRows().length === 0) {
    <app-empty-state
      id="prescriptions-list-app-empty-state"
      icon="pi pi-inbox"
      title="Brak recept"
      message="Nie znaleziono recept spełniających kryteria."
    />
  } @else {
    <app-data-table
      id="prescriptions-list-table"
      [rows]="filteredRows()"
      [columns]="columns"
      [loading]="loading()"
      dataKey="id"
      (rowSelect)="openPrescription($event)"
    />
  }
</div>
