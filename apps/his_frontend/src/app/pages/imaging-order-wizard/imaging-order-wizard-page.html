<div id="imaging-order-wizard-page" class="his-page">
  <app-page-header
    id="imaging-order-wizard-app-page-header"
    title="Nowe zlecenie badania obrazowego"
  />

  <p-stepper id="imaging-order-wizard-p-stepper" [value]="1" [linear]="true">
    <p-step-list id="imaging-order-wizard-p-step-list">
      <p-step id="imaging-order-wizard-p-step" [value]="1">Rodzaj badania</p-step>
      <p-step id="imaging-order-wizard-p-step-2" [value]="2">Wskazania kliniczne</p-step>
      <p-step id="imaging-order-wizard-p-step-3" [value]="3">Bezpieczeństwo pacjenta</p-step>
      <p-step id="imaging-order-wizard-p-step-4" [value]="4">Termin badania</p-step>
      <p-step id="imaging-order-wizard-p-step-5" [value]="5">Podsumowanie</p-step>
    </p-step-list>
    <p-step-panels id="imaging-order-wizard-p-step-panels">
      <p-step-panel id="imaging-order-wizard-p-step-panel" [value]="1">
        <ng-template #content let-activateCallback="activateCallback">
          <form
            id="imaging-order-wizard-card"
            [formGroup]="step1Form"
            class="his-card his-form-grid"
          >
            <app-form-field
              id="imaging-order-wizard-app-form-field"
              label="Modalność"
              [required]="true"
            >
              <p-selectbutton
                id="imaging-order-wizard-modality"
                [options]="modalityOptions"
                formControlName="modality"
                optionLabel="label"
                optionValue="value"
              />
            </app-form-field>

            <app-form-field
              id="imaging-order-wizard-app-form-field-2"
              label="Badanie"
              [required]="true"
              [control]="step1Form.controls.examCode"
            >
              <p-select
                id="imaging-order-wizard-exam-code"
                [options]="examsForModality()"
                formControlName="examCode"
                optionLabel="name"
                optionValue="code"
                placeholder="Wybierz badanie"
                [disabled]="!step1Form.controls.modality.value"
              />
            </app-form-field>

            @if (selectedExam()?.requiresLaterality) {
              <app-form-field
                id="imaging-order-wizard-app-form-field-3"
                label="Strona"
                [required]="true"
                [control]="step1Form.controls.laterality"
              >
                <p-selectbutton
                  id="imaging-order-wizard-laterality"
                  [options]="lateralityOptions"
                  formControlName="laterality"
                  optionLabel="label"
                  optionValue="value"
                />
              </app-form-field>
            }

            <app-form-field
              id="imaging-order-wizard-app-form-field-4"
              label="Z kontrastem"
              [control]="step1Form.controls.contrast"
            >
              <p-toggleswitch
                id="imaging-order-wizard-contrast"
                formControlName="contrast"
                [disabled]="!selectedExam()?.contrastPossible"
              />
            </app-form-field>
          </form>
          <app-wizard-step-footer
            id="imaging-order-wizard-app-wizard-step-footer"
            [first]="true"
            (next)="advanceFromStep1(activateCallback)"
            (cancelled)="cancel()"
          />
        </ng-template>
      </p-step-panel>

      <p-step-panel id="imaging-order-wizard-p-step-panel-2" [value]="2">
        <ng-template #content let-activateCallback="activateCallback">
          <form
            id="imaging-order-wizard-card-2"
            [formGroup]="step2Form"
            class="his-card his-form-grid"
          >
            <app-form-field
              id="imaging-order-wizard-app-form-field-5"
              label="Wskazania kliniczne"
              [required]="true"
              [control]="step2Form.controls.clinicalIndication"
            >
              <textarea
                id="imaging-order-wizard-clinical-indication"
                pTextarea
                rows="3"
                formControlName="clinicalIndication"
              ></textarea>
            </app-form-field>

            <app-form-field
              id="imaging-order-wizard-app-form-field-6"
              label="Pytanie kliniczne"
              [control]="step2Form.controls.clinicalQuestion"
            >
              <textarea
                id="imaging-order-wizard-clinical-question"
                pTextarea
                rows="2"
                formControlName="clinicalQuestion"
              ></textarea>
            </app-form-field>

            <app-form-field id="imaging-order-wizard-app-form-field-7" label="Rozpoznanie">
              <p-autocomplete
                id="imaging-order-wizard-diagnosis-code"
                [suggestions]="diagnosisOptions()"
                (completeMethod)="searchDiagnosis($event)"
                formControlName="diagnosisCode"
                optionLabel="label"
                [dropdown]="true"
                [forceSelection]="true"
                [showClear]="true"
                appendTo="body"
                placeholder="Wybierz rozpoznanie"
                class="his-full-width"
              />
            </app-form-field>

            <app-form-field
              id="imaging-order-wizard-app-form-field-8"
              label="Pilność"
              [required]="true"
              [control]="step2Form.controls.urgency"
            >
              <p-selectbutton
                id="imaging-order-wizard-urgency"
                [options]="urgencyOptions"
                formControlName="urgency"
                optionLabel="label"
                optionValue="value"
              />
            </app-form-field>
          </form>
          <app-wizard-step-footer
            id="imaging-order-wizard-app-wizard-step-footer-2"
            (back)="activateCallback(1)"
            (next)="advanceFromStep2(activateCallback)"
            (cancelled)="cancel()"
          />
        </ng-template>
      </p-step-panel>

      <p-step-panel id="imaging-order-wizard-p-step-panel-3" [value]="3">
        <ng-template #content let-activateCallback="activateCallback">
          <app-imaging-safety-form
            id="imaging-order-wizard-safety-form"
            [form]="step3Form"
            [needsPregnancyCheck]="needsPregnancyCheck()"
            [isMri]="isMri()"
            [egfrBlocksContrast]="egfrBlocksContrast()"
            [latestCreatinineEgfr]="latestCreatinineEgfr()"
          />
          <app-wizard-step-footer
            id="imaging-order-wizard-app-wizard-step-footer-3"
            (back)="activateCallback(2)"
            (next)="advanceFromStep3(activateCallback)"
            (cancelled)="cancel()"
          />
        </ng-template>
      </p-step-panel>

      <p-step-panel id="imaging-order-wizard-p-step-panel-4" [value]="4">
        <ng-template #content let-activateCallback="activateCallback">
          <form
            id="imaging-order-wizard-card-4"
            [formGroup]="step4Form"
            class="his-card his-form-grid"
          >
            @if (isCito()) {
              <div id="imaging-order-wizard-toolbar" class="his-toolbar">
                <button
                  id="imaging-order-wizard-button"
                  type="button"
                  pButton
                  label="Najbliższy wolny termin"
                  icon="pi pi-bolt"
                  (click)="findNearestSlot()"
                ></button>
                <button
                  id="imaging-order-wizard-p-button-outlined"
                  type="button"
                  pButton
                  class="p-button-outlined"
                  label="Wykonaj natychmiast (bez terminu)"
                  icon="pi pi-clock"
                  (click)="toggleImmediate()"
                ></button>
              </div>
            }

            <app-form-field
              id="imaging-order-wizard-app-form-field-16"
              label="Data badania"
              [control]="step4Form.controls.slotId"
            >
              <p-datepicker
                id="imaging-order-wizard-date"
                formControlName="date"
                dateFormat="dd.mm.yy"
                [minDate]="step4Form.controls.date.value"
              />
            </app-form-field>

            @if (!step4Form.controls.immediate.value && step1Form.controls.modality.value) {
              <app-slot-picker
                id="imaging-order-wizard-app-slot-picker"
                [modality]="step1Form.controls.modality.value!"
                [date]="slotDateIso()"
                [selectedSlotId]="step4Form.controls.slotId.value"
                [refreshKey]="slotRefresh()"
                (slotSelected)="onSlotSelected($event)"
              />
            }
          </form>
          <app-wizard-step-footer
            id="imaging-order-wizard-app-wizard-step-footer-4"
            (back)="activateCallback(3)"
            (next)="advanceFromStep4(activateCallback)"
            (cancelled)="cancel()"
          />
        </ng-template>
      </p-step-panel>

      <p-step-panel id="imaging-order-wizard-p-step-panel-5" [value]="5">
        <ng-template #content let-activateCallback="activateCallback">
          <div id="imaging-order-wizard-card-5" class="his-card">
            <app-summary-list id="imaging-order-wizard-app-summary-list" [items]="summaryItems()" />
            <app-fhir-integration-note
              id="imaging-order-wizard-app-fhir-integration-note"
              resource="ServiceRequest"
            />
          </div>
          <app-wizard-step-footer
            id="imaging-order-wizard-app-wizard-step-footer-5"
            [last]="true"
            [busy]="submitting()"
            submitLabel="Wyślij zlecenie"
            (back)="activateCallback(4)"
            (submitted)="submit()"
            (cancelled)="cancel()"
          />
        </ng-template>
      </p-step-panel>
    </p-step-panels>
  </p-stepper>
</div>
