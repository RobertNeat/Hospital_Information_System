<p-timeline
  id="order-status-timeline-p-timeline"
  [value]="entries()"
  styleClass="his-order-status-timeline"
>
  <ng-template #content let-entry>
    <div id="order-status-timeline-entry" class="his-order-status-timeline__entry">
      <app-status-tag
        id="order-status-timeline-app-status-tag"
        kind="orderStatus"
        [value]="entry.status"
      />
      <span id="order-status-timeline-muted" class="his-muted">{{
        entry.at | date: 'dd.MM.yyyy HH:mm'
      }}</span>
      @if (entry.byId) {
        <span id="order-status-timeline-muted-2" class="his-muted">{{
          entry.byId | staffName
        }}</span>
      }
      @if (entry.note) {
        <p id="order-status-timeline-note" class="his-order-status-timeline__note">
          {{ entry.note }}
        </p>
      }
    </div>
  </ng-template>
</p-timeline>
