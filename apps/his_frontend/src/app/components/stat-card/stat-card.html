@if (link(); as l) {
  <a class="his-stat-card" [class]="'his-stat-card--' + severity()" [routerLink]="l">
    <ng-container [ngTemplateOutlet]="content" />
  </a>
} @else {
  <div class="his-stat-card" [class]="'his-stat-card--' + severity()">
    <ng-container [ngTemplateOutlet]="content" />
  </div>
}

<ng-template #content>
  <i [class]="icon()" class="his-stat-card__icon"></i>
  <div class="his-stat-card__body">
    <span class="his-stat-card__value">{{ value() }}</span>
    <span class="his-stat-card__label">{{ label() }}</span>
    @if (hint()) {
      <span class="his-stat-card__hint his-muted">{{ hint() }}</span>
    }
  </div>
</ng-template>
