@if (link(); as l) {
  <a id="stat-card" class="his-stat-card" [class]="'his-stat-card--' + severity()" [routerLink]="l">
    <ng-container [ngTemplateOutlet]="content" />
  </a>
} @else {
  <div id="stat-card-2" class="his-stat-card" [class]="'his-stat-card--' + severity()">
    <ng-container [ngTemplateOutlet]="content" />
  </div>
}

<ng-template #content>
  <i id="stat-card-icon" [class]="icon()" class="his-stat-card__icon"></i>
  <div id="stat-card-body" class="his-stat-card__body">
    <span id="stat-card-value" class="his-stat-card__value">{{ value() }}</span>
    <span id="stat-card-label" class="his-stat-card__label">{{ label() }}</span>
    @if (hint()) {
      <span id="stat-card-hint" class="his-stat-card__hint his-muted">{{ hint() }}</span>
    }
  </div>
</ng-template>
