<div id="prescription-quantity-fields-form-grid" class="his-form-grid" [formGroup]="quantityForm()">
  <app-form-field
    id="prescription-quantity-fields-app-form-field-2"
    label="Czas terapii (dni)"
    for="durationDays"
    [required]="true"
    [control]="quantityForm().get('durationDays')"
  >
    <p-inputNumber
      id="prescription-quantity-fields-duration-days"
      inputId="durationDays"
      formControlName="durationDays"
      [min]="1"
      [max]="365"
      [fluid]="true"
      (onInput)="durationInput.emit()"
    />
  </app-form-field>

  <app-form-field
    id="prescription-quantity-fields-app-form-field-3"
    label="Ilość opakowań"
    for="quantityPackages"
    [required]="true"
    [control]="quantityForm().get('quantityPackages')"
    hint="Sugerowana ilość jest wyliczana automatycznie; można ją zmienić ręcznie."
  >
    <p-inputNumber
      id="prescription-quantity-fields-quantity-packages"
      inputId="quantityPackages"
      formControlName="quantityPackages"
      [min]="1"
      [fluid]="true"
      (onInput)="quantityInput.emit()"
    />
  </app-form-field>

  <app-form-field
    id="prescription-quantity-fields-app-form-field-4"
    label="Poziom refundacji"
    for="reimbursement"
    [required]="true"
    [control]="quantityForm().get('reimbursement')"
  >
    <p-select
      id="prescription-quantity-fields-reimbursement"
      inputId="reimbursement"
      formControlName="reimbursement"
      [options]="reimbursementOptions()"
      optionLabel="label"
      optionValue="value"
      placeholder="Wybierz poziom refundacji"
      [fluid]="true"
    />
  </app-form-field>

  <app-form-field
    id="prescription-quantity-fields-app-form-field-5"
    label="Ważna od"
    for="validFrom"
    [control]="datesForm().get('validFrom')"
  >
    <p-datepicker
      id="prescription-quantity-fields-p-datepicker"
      inputId="validFrom"
      [formControl]="datesForm().controls.validFrom"
      dateFormat="dd.mm.yy"
      [showIcon]="true"
      [fluid]="true"
    />
  </app-form-field>
</div>
