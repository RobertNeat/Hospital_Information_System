<p-autocomplete
  id="patient-search-p-autocomplete"
  styleClass="his-patient-search__autocomplete"
  inputId="patient-search-input"
  [(ngModel)]="selectedValue"
  [suggestions]="suggestions()"
  (completeMethod)="search($event)"
  (onSelect)="onSelect($event)"
  [placeholder]="placeholder()"
  optionLabel="lastName"
  [minLength]="1"
  [showEmptyMessage]="true"
>
  <ng-template let-patient #item>
    <div [id]="'patient-search-item-' + patient.id" class="his-patient-search__item">
      <span [id]="'patient-search-name-' + patient.id" class="his-patient-search__name">{{
        patient | fullName
      }}</span>
      <span [id]="'patient-search-muted-' + patient.id" class="his-muted">
        {{ patient.pesel ?? 'brak PESEL' }} · {{ patient.birthDate | age }}
        @if (patient.wardName) {
          · {{ patient.wardName }}
        }
      </span>
    </div>
  </ng-template>
</p-autocomplete>
