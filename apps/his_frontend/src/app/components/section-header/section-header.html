<div id="section-header" class="his-section-header" [class]="'his-section-header--' + variant()">
  <div id="section-header-title" class="his-section-header__title">
    @if (icon()) {
      <i id="section-header-i" [class]="icon()"></i>
    }
    <span id="section-header-span">{{ title() }}</span>
    @if (count(); as c) {
      <span id="section-header-count" class="his-section-header__count">{{ c }}</span>
    }
  </div>
  <div id="section-header-actions" class="his-section-header__actions">
    <ng-content select="[actions]" />
  </div>
</div>
