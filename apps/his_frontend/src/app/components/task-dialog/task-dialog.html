<p-dialog
  id="task-dialog-p-dialog"
  header="Deleguj zadanie"
  [visible]="visible()"
  [modal]="true"
  [style]="{ width: '32rem' }"
  (onHide)="onHide()"
  (visibleChange)="visibleChange.emit($event)"
>
  <form id="task-dialog-form" [formGroup]="form" class="his-task-dialog__form">
    <app-form-field
      id="task-dialog-app-form-field"
      label="Tytuł"
      [control]="form.controls.title"
      [required]="true"
    >
      <input id="task-dialog-title" pInputText type="text" formControlName="title" />
    </app-form-field>

    <app-form-field
      id="task-dialog-app-form-field-2"
      label="Opis"
      [control]="form.controls.description"
    >
      <textarea
        id="task-dialog-description"
        pTextarea
        rows="3"
        formControlName="description"
      ></textarea>
    </app-form-field>

    <app-form-field
      id="task-dialog-app-form-field-3"
      label="Przypisz do"
      [control]="form.controls.assignedToId"
      [required]="true"
    >
      <p-select
        id="task-dialog-assigned-to-id"
        formControlName="assignedToId"
        [options]="staffGroups()"
        optionLabel="label"
        optionValue="value"
        optionGroupLabel="label"
        optionGroupChildren="items"
        placeholder="Wybierz pracownika"
        [showClear]="true"
      />
    </app-form-field>

    <app-form-field id="task-dialog-app-form-field-4" label="Pacjent (opcjonalnie)">
      @if (selectedPatient(); as patient) {
        <div id="task-dialog-patient" class="his-task-dialog__patient">
          <span id="task-dialog-span">{{ patient.lastName }} {{ patient.firstName }}</span>
          <button
            id="task-dialog-patient-clear"
            type="button"
            class="his-task-dialog__patient-clear"
            aria-label="Usuń wybranego pacjenta"
            pTooltip="Usuń wybranego pacjenta"
            tooltipPosition="left"
            (click)="clearPatient()"
          >
            <i id="task-dialog-pi" class="pi pi-times"></i>
          </button>
        </div>
      } @else {
        <app-patient-search
          id="task-dialog-app-patient-search"
          (patientSelected)="onPatientSelected($event)"
        />
      }
    </app-form-field>

    <app-form-field
      id="task-dialog-app-form-field-5"
      label="Priorytet"
      [control]="form.controls.priority"
      [required]="true"
    >
      <p-select
        id="task-dialog-priority"
        formControlName="priority"
        [options]="priorityOptions"
        optionLabel="label"
        optionValue="value"
      />
    </app-form-field>

    <app-form-field id="task-dialog-app-form-field-6" label="Termin wykonania">
      <p-datepicker
        id="task-dialog-due-at"
        formControlName="dueAt"
        [showTime]="true"
        dateFormat="dd.mm.yy"
        [showIcon]="true"
      />
    </app-form-field>
  </form>

  <ng-template #footer>
    <p-button
      id="task-dialog-p-button"
      label="Anuluj"
      severity="secondary"
      text
      (onClick)="onHide()"
    />
    <p-button id="task-dialog-p-button-2" label="Deleguj" icon="pi pi-check" (onClick)="submit()" />
  </ng-template>
</p-dialog>
