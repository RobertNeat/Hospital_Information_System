<nav id="patient-chart-nav-chart-nav" class="his-chart-nav">
  @for (item of items(); track item.segment; let idx0 = $index) {
    <a
      [id]="'patient-chart-nav-chart-nav-item-' + idx0"
      class="his-chart-nav__item"
      [routerLink]="linkFor(item)"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{
        paths: 'exact',
        matrixParams: 'ignored',
        queryParams: 'ignored',
        fragment: 'ignored',
      }"
    >
      {{ item.label }}
    </a>
  }
</nav>
