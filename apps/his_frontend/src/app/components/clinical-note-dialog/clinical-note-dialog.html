<p-dialog
  id="clinical-note-dialog-p-dialog"
  header="Dodaj notatkę kliniczną"
  [visible]="visible()"
  [modal]="true"
  [style]="{ width: '32rem' }"
  (visibleChange)="visibleChange.emit($event)"
  (onHide)="onHide()"
>
  <form id="clinical-note-dialog-form-grid" [formGroup]="form" class="his-form-grid">
    <app-form-field
      id="clinical-note-dialog-app-form-field"
      label="Kategoria"
      [required]="true"
      [control]="form.controls.category"
    >
      <p-select
        id="clinical-note-dialog-category"
        [options]="categoryOptions"
        formControlName="category"
        optionLabel="label"
        optionValue="value"
        placeholder="Wybierz kategorię"
        class="his-full-width"
      />
    </app-form-field>

    <app-form-field
      id="clinical-note-dialog-app-form-field-2"
      label="Tytuł"
      [required]="true"
      [control]="form.controls.title"
    >
      <input
        id="clinical-note-dialog-title"
        pInputText
        formControlName="title"
        class="his-full-width"
      />
    </app-form-field>

    <div id="clinical-note-dialog-form-grid-full" class="his-form-grid__full">
      <app-form-field
        id="clinical-note-dialog-app-form-field-3"
        label="Treść"
        [required]="true"
        [control]="form.controls.content"
      >
        <textarea
          id="clinical-note-dialog-content"
          pTextarea
          formControlName="content"
          rows="5"
          class="his-full-width"
          placeholder="Minimum 10 znaków"
        ></textarea>
      </app-form-field>
    </div>

    <div id="clinical-note-dialog-form-grid-full-2" class="his-form-grid__full">
      <app-form-field
        id="clinical-note-dialog-app-form-field-4"
        label="Objawy"
        [control]="form.controls.symptoms"
      >
        <p-multiselect
          id="clinical-note-dialog-symptoms"
          [options]="symptomOptions"
          formControlName="symptoms"
          optionLabel="label"
          optionValue="value"
          display="chip"
          placeholder="Wybierz objawy"
          class="his-full-width"
        />
      </app-form-field>
    </div>
  </form>

  <ng-template #footer>
    <div id="clinical-note-dialog-dialog-footer" class="his-dialog-footer">
      <p-button
        id="clinical-note-dialog-p-button"
        label="Anuluj"
        severity="secondary"
        [text]="true"
        (onClick)="onCancel()"
      />
      <p-button
        id="clinical-note-dialog-p-button-2"
        label="Zapisz notatkę"
        icon="pi pi-check"
        (onClick)="onSave()"
      />
    </div>
  </ng-template>
</p-dialog>
