<dl class="his-summary-list" [class.his-summary-list--1col]="columns() === 1">
  @for (item of items(); track item.label) {
    <div class="his-summary-list__row">
      <dt>{{ item.label }}</dt>
      <dd>
        @if (item.severity) {
          <p-tag [value]="item.value ?? '—'" [severity]="item.severity" />
        } @else {
          {{ item.value ?? '—' }}
        }
        @if (item.hint) {
          <span class="his-muted his-summary-list__hint">{{ item.hint }}</span>
        }
      </dd>
    </div>
  }
</dl>
