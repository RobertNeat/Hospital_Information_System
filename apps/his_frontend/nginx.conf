# Strefy limitu żądań (per IP klienta). Plik trafia do /etc/nginx/conf.d/,
# czyli jest included w http{} bazowego obrazu nginx:1.29-alpine - dyrektywy
# limit_req_zone na tym poziomie pliku są więc w kontekście http, jak wymaga nginx.
# login: ochrona przed brute-force; /api/: ogólna ochrona przed DoS, nie blokuje normalnego ruchu.
limit_req_zone $binary_remote_addr zone=his_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=his_api:10m rate=15r/s;
# 429 (Too Many Requests) zamiast domyślnego 503, by nie mylić z awarią backendu.
limit_req_status 429;

# H2C smuggling mitigation: forward the Upgrade header only when it is exactly
# "websocket" (case-insensitive); any other/absent value clears Connection so
# nginx cannot be tricked into upgrading a proxied connection to h2c.
map $http_upgrade $his_connection_upgrade {
    default         "";
    "~*^websocket$" "upgrade";
}
map $http_upgrade $his_upgrade {
    default         "";
    "~*^websocket$" "websocket";
}

server {
    listen 10400;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS. Backend w zmiennej + resolver: nginx nie wywraca się przy
    # starcie, gdy his-backend jeszcze nie działa (nazwa rozwiązywana per żądanie).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $his_backend http://his-backend:10420;

    # Dopasowanie dokładne przed ogólnym /api/ - osobny, ostrzejszy limit na logowanie.
    # 'internal' nie ma tu zastosowania: to publiczny endpoint REST API, wymagany spoza serwera.
    location = /api/v1/auth/login {
        limit_req zone=his_login burst=5 nodelay;
        # nosemgrep: generic.nginx.security.missing-internal.missing-internal
        proxy_pass $his_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 'internal' nie ma tu zastosowania: to publiczne REST API, wymagane spoza serwera.
    location /api/ {
        limit_req zone=his_api burst=30 nodelay;
        # nosemgrep: generic.nginx.security.missing-internal.missing-internal
        proxy_pass $his_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 'internal' nie ma tu zastosowania: to publiczny endpoint WebSocket, wymagany spoza serwera.
    location /ws {
        # nosemgrep: generic.nginx.security.missing-internal.missing-internal
        proxy_pass $his_backend;
        # Tylko realny WebSocket upgrade jest przekazywany dalej (patrz mapy $his_upgrade /
        # $his_connection_upgrade powyżej) - zapobiega H2C smuggling przez naduzycie Upgrade.
        # Semgrep nie śledzi wartości przez `map` i zgłasza Upgrade/Connection+proxy_http_version
        # jako ryzyko niezależnie od ograniczenia wartości do "websocket".
        # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
        proxy_http_version 1.1;
        proxy_set_header Upgrade $his_upgrade;
        proxy_set_header Connection $his_connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
