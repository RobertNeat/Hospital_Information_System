spring.application.name=e-receipt
server.port=10421

# mTLS jest domyslnie wlaczony: profil `mtls` (application-mtls.properties) dolaczany przez include.
# Wylaczenie (testy, IDE bez certyfikatow): HIS_MTLS_ENABLED=false (zmienna srodowiskowa albo -DHIS_MTLS_ENABLED=false).
spring.profiles.include=mtls-${HIS_MTLS_ENABLED:true}
spring.profiles.group.mtls-true=mtls

# Health (liveness/readiness) bez szczegolow
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Klient FHIR do his_backend (zmiana stanu recepty). Domyslnie wylaczony; compose wlacza.
# mTLS: profil `mtls` ustawia paczke SSL (`mtls`) i URL `https://` (certyfikat klienta z paczki).
ereceipt.his.enabled=${ERECEIPT_HIS_ENABLED:false}
ereceipt.his.base-url=${ERECEIPT_HIS_URL:http://localhost:10420/fhir}
ereceipt.his.connect-timeout=${ERECEIPT_HIS_CONNECT_TIMEOUT:1s}
ereceipt.his.read-timeout=${ERECEIPT_HIS_READ_TIMEOUT:3s}
ereceipt.his.ssl-bundle=${ERECEIPT_HIS_SSL_BUNDLE:}
