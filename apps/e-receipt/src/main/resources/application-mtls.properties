# Profil mtls (domyslnie wlaczony, zob. spring.profiles.include w application.properties).
# Port aplikacji = HTTPS z wymaganym certyfikatem klienta, tylko /fhir/**; UI Thymeleaf (bez certyfikatu, dla
# przegladarki) na osobnym porcie HTTP `mtls.http-port` (tylko `/` i `/ui/**`); health na porcie zarzadzania
# (HTTP, bez TLS, nie publikowany na host). Brak plikow/hasel przerywa start (paczki SSL laduja sie przy starcie).
server.port=10421
server.ssl.bundle=mtls
server.ssl.client-auth=need
mtls.http-port=${ERECEIPT_UI_PORT:10431}
management.server.port=${ERECEIPT_MANAGEMENT_PORT:10441}
management.server.ssl.enabled=false
spring.ssl.bundle.jks.mtls.key.alias=${MTLS_KEY_ALIAS:server}
spring.ssl.bundle.jks.mtls.keystore.location=${MTLS_KEYSTORE:file:./certs/keystore.p12}
spring.ssl.bundle.jks.mtls.keystore.password=${MTLS_KEYSTORE_PASSWORD}
spring.ssl.bundle.jks.mtls.keystore.type=PKCS12
spring.ssl.bundle.jks.mtls.truststore.location=${MTLS_TRUSTSTORE:file:./certs/truststore.p12}
spring.ssl.bundle.jks.mtls.truststore.password=${MTLS_TRUSTSTORE_PASSWORD}
spring.ssl.bundle.jks.mtls.truststore.type=PKCS12
ereceipt.his.base-url=${ERECEIPT_HIS_URL:https://localhost:10424/fhir}
ereceipt.his.ssl-bundle=${ERECEIPT_HIS_SSL_BUNDLE:mtls}
