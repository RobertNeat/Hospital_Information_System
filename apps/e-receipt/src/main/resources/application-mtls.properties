# mTLS (FHIR): aktywacja profilem `mtls`, np. --spring.profiles.active=mtls
server.port=10421
server.ssl.bundle=server
server.ssl.client-auth=need
spring.ssl.bundle.jks.server.key.alias=${MTLS_KEY_ALIAS:server}
spring.ssl.bundle.jks.server.keystore.location=${MTLS_KEYSTORE:file:./certs/keystore.p12}
spring.ssl.bundle.jks.server.keystore.password=${MTLS_KEYSTORE_PASSWORD}
spring.ssl.bundle.jks.server.keystore.type=PKCS12
spring.ssl.bundle.jks.server.truststore.location=${MTLS_TRUSTSTORE:file:./certs/truststore.p12}
spring.ssl.bundle.jks.server.truststore.password=${MTLS_TRUSTSTORE_PASSWORD}
spring.ssl.bundle.jks.server.truststore.type=PKCS12
