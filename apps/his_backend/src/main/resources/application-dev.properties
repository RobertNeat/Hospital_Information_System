# Profil dev: lokalny Postgres (docker compose) + dane referencyjne i mock
spring.datasource.url=${HIS_DB_URL:jdbc:postgresql://localhost:5432/his}
spring.datasource.username=${HIS_DB_USER:his}
spring.datasource.password=${HIS_DB_PASSWORD:his}
spring.liquibase.contexts=${HIS_LIQUIBASE_CONTEXTS:reference,mock}
# Jawny klucz deweloperski JWT (NIE uzywac poza lokalnym dev)
his.security.jwt.secret=${HIS_JWT_SECRET:dev-only-jwt-secret-do-not-use-in-production-0123456789}
