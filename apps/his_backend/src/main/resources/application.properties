spring.application.name=his_backend
server.port=10420

# Baza danych (bez domyslnych danych dostepowych; dev: profil `dev`)
spring.datasource.url=${HIS_DB_URL}
spring.datasource.username=${HIS_DB_USER}
spring.datasource.password=${HIS_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Liquibase: bez jawnego kontekstu uruchomione bylyby tez changesety `mock`
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.contexts=${HIS_LIQUIBASE_CONTEXTS:reference}

# Terminologia SNOMED CT: Snowstorm Lite (FHIR). Domyslnie wylaczona; brak polaczenia przy starcie (klient leniwy).
his.terminology.snowstorm.enabled=${HIS_SNOWSTORM_ENABLED:false}
his.terminology.snowstorm.base-url=${HIS_SNOWSTORM_URL:http://localhost:8080/fhir}
his.terminology.snowstorm.connect-timeout=${HIS_SNOWSTORM_CONNECT_TIMEOUT:2s}
his.terminology.snowstorm.read-timeout=${HIS_SNOWSTORM_READ_TIMEOUT:5s}
his.terminology.snowstorm.display-language=${HIS_SNOWSTORM_DISPLAY_LANGUAGE:pl,en}
his.terminology.snowstorm.max-page-size=${HIS_SNOWSTORM_MAX_PAGE_SIZE:100}

# Podpowiedzi SNOMED CT wg specjalizacji lekarza: specjalizacja (znormalizowana: male litery, bez diakrytykow) -> ECL
# osobno dla rozpoznan, objawow i procedur. Tylko SCTID/ECL (bez tresci licencjonowanej). Brak profilu lub pusty
# ECL danego rodzaju -> `fallback`. Hierarchie: 64572001 Disease, 404684003 Clinical finding, 418799008 Finding
# reported by subject (objaw), 71388002 Procedure, 387713003 Surgical procedure, 103693007 Diagnostic procedure,
# 363679005 Imaging, 108252007 Laboratory procedure, 363698007 Finding site, 363704007 Procedure site,
# 113257007 Structure of cardiovascular system, 21483005 Central nervous system structure.
his.terminology.suggestions.fallback.diagnosis=<< 64572001
his.terminology.suggestions.fallback.symptom=<< 418799008
his.terminology.suggestions.fallback.procedure=<< 71388002

his.terminology.suggestions.profiles[0].specializations=choroby wewnetrzne,medycyna rodzinna
his.terminology.suggestions.profiles[0].diagnosis=<< 64572001
his.terminology.suggestions.profiles[0].symptom=<< 418799008
his.terminology.suggestions.profiles[0].procedure=<< 103693007 OR << 387713003

his.terminology.suggestions.profiles[1].specializations=kardiologia
his.terminology.suggestions.profiles[1].diagnosis=<< 404684003 : 363698007 = << 113257007
his.terminology.suggestions.profiles[1].symptom=<< 418799008
his.terminology.suggestions.profiles[1].procedure=<< 71388002 : 363704007 = << 113257007

his.terminology.suggestions.profiles[2].specializations=neurologia
his.terminology.suggestions.profiles[2].diagnosis=<< 404684003 : 363698007 = << 21483005
his.terminology.suggestions.profiles[2].symptom=<< 418799008
his.terminology.suggestions.profiles[2].procedure=<< 71388002 : 363704007 = << 21483005

his.terminology.suggestions.profiles[3].specializations=chirurgia ogolna
his.terminology.suggestions.profiles[3].diagnosis=<< 64572001
his.terminology.suggestions.profiles[3].symptom=<< 418799008
his.terminology.suggestions.profiles[3].procedure=<< 387713003

his.terminology.suggestions.profiles[4].specializations=medycyna ratunkowa
his.terminology.suggestions.profiles[4].diagnosis=<< 404684003
his.terminology.suggestions.profiles[4].symptom=<< 418799008
his.terminology.suggestions.profiles[4].procedure=<< 71388002

his.terminology.suggestions.profiles[5].specializations=radiologia
his.terminology.suggestions.profiles[5].diagnosis=<< 404684003
his.terminology.suggestions.profiles[5].symptom=<< 418799008
his.terminology.suggestions.profiles[5].procedure=<< 363679005

his.terminology.suggestions.profiles[6].specializations=diagnostyka laboratoryjna
his.terminology.suggestions.profiles[6].diagnosis=<< 64572001
his.terminology.suggestions.profiles[6].symptom=<< 418799008
his.terminology.suggestions.profiles[6].procedure=<< 108252007

# FHIR (R4, HAPI): wywolania przychodzace z uslug e-* (`/fhir/**`) autoryzuje wspolny klucz w naglowku X-Service-Key
# (pusty = wszystkie odrzucane). Docelowo mTLS zastapi klucz.
his.fhir.service-key=${HIS_FHIR_SERVICE_KEY:}

# Klient FHIR do e-receipt (recepty e_prescription). Domyslnie wylaczony; brak e-receipt nie blokuje wystawiania recept.
# mTLS: ustaw ssl-bundle na nazwe paczki spring.ssl.bundle.* (np. `fhir-client` z profilu mtls).
his.integration.ereceipt.enabled=${HIS_ERECEIPT_ENABLED:false}
his.integration.ereceipt.base-url=${HIS_ERECEIPT_URL:http://localhost:10421/fhir}
his.integration.ereceipt.connect-timeout=${HIS_ERECEIPT_CONNECT_TIMEOUT:1s}
his.integration.ereceipt.read-timeout=${HIS_ERECEIPT_READ_TIMEOUT:3s}
his.integration.ereceipt.ssl-bundle=${HIS_ERECEIPT_SSL_BUNDLE:}

# Klient FHIR do e-laboratory (zlecenia lab, anulowanie). Domyslnie wylaczony; brak e-laboratory nie blokuje zlecania.
his.integration.elab.enabled=${HIS_ELAB_ENABLED:false}
his.integration.elab.base-url=${HIS_ELAB_URL:http://localhost:10422/fhir}
his.integration.elab.connect-timeout=${HIS_ELAB_CONNECT_TIMEOUT:1s}
his.integration.elab.read-timeout=${HIS_ELAB_READ_TIMEOUT:3s}
his.integration.elab.ssl-bundle=${HIS_ELAB_SSL_BUNDLE:}

# Klient FHIR do e-imaging (zlecenia obrazowe, anulowanie). Domyslnie wylaczony; brak e-imaging nie blokuje zlecania.
his.integration.eimg.enabled=${HIS_EIMG_ENABLED:false}
his.integration.eimg.base-url=${HIS_EIMG_URL:http://localhost:10423/fhir}
his.integration.eimg.connect-timeout=${HIS_EIMG_CONNECT_TIMEOUT:1s}
his.integration.eimg.read-timeout=${HIS_EIMG_READ_TIMEOUT:3s}
his.integration.eimg.ssl-bundle=${HIS_EIMG_SSL_BUNDLE:}

# Paginacja: maksymalnie 100 elementow na strone (wieksze size jest obcinane), domyslnie 20
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# JSON (Jackson 3): Instant jako ISO-8601 z `Z`, LocalDate jako ISO, pola null pomijane (NON_ABSENT);
# pola z semantycznym null maja @JsonInclude(ALWAYS) na polu
spring.jackson.default-property-inclusion=non_absent
spring.jackson.datatype.datetime.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Health (liveness/readiness) bez szczegolow
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Bezpieczenstwo: JWT HS256 (stateless). Klucz WYMAGANY (min. 32 bajty UTF-8), bez wartosci domyslnej poza profilem dev.
his.security.jwt.secret=${HIS_JWT_SECRET:}
his.security.jwt.ttl=${HIS_JWT_TTL:8h}
his.security.jwt.issuer=${HIS_JWT_ISSUER:his-backend}
# Blokada konta po kolejnych nieudanych logowaniach
his.security.lockout.max-attempts=${HIS_LOCKOUT_MAX_ATTEMPTS:5}
his.security.lockout.duration=${HIS_LOCKOUT_DURATION:15m}
# CORS wylaczony (jedna origin przez nginx); lista origin (po przecinku) wlacza go
his.security.cors.allowed-origins=${HIS_CORS_ALLOWED_ORIGINS:}

# WebSocket/STOMP: dozwolone originy handshake (po przecinku); puste = tylko same-origin (frontend za jednym nginx)
his.websocket.allowed-origins=${HIS_WS_ALLOWED_ORIGINS:}
