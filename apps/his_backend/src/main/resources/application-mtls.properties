# Profil mtls (domyslnie wlaczony, zob. spring.profiles.include w application.properties).
# Paczki SSL laduja sie przy starcie, wiec brak plikow/hasel przerywa start - dlatego osobny profil, nie baza.
# Glowny port = HTTPS z wymaganym certyfikatem klienta, tylko /fhir/**; HTTP (`mtls.http-port`) dla /api/** i /ws
# (nginx); health na osobnym porcie zarzadzania (HTTP, bez TLS, nie publikowany na host).
server.port=${HIS_FHIR_PORT:10424}
server.ssl.bundle=mtls
server.ssl.client-auth=need
mtls.http-port=10420
management.server.port=${HIS_MANAGEMENT_PORT:10440}
management.server.ssl.enabled=false
spring.ssl.bundle.jks.mtls.key.alias=${MTLS_KEY_ALIAS:his}
spring.ssl.bundle.jks.mtls.keystore.location=${MTLS_KEYSTORE:file:./certs/keystore.p12}
spring.ssl.bundle.jks.mtls.keystore.password=${MTLS_KEYSTORE_PASSWORD}
spring.ssl.bundle.jks.mtls.keystore.type=PKCS12
spring.ssl.bundle.jks.mtls.truststore.location=${MTLS_TRUSTSTORE:file:./certs/truststore.p12}
spring.ssl.bundle.jks.mtls.truststore.password=${MTLS_TRUSTSTORE_PASSWORD}
spring.ssl.bundle.jks.mtls.truststore.type=PKCS12
his.integration.ereceipt.base-url=${HIS_ERECEIPT_URL:https://localhost:10421/fhir}
his.integration.ereceipt.ssl-bundle=${HIS_ERECEIPT_SSL_BUNDLE:mtls}
his.integration.elab.base-url=${HIS_ELAB_URL:https://localhost:10422/fhir}
his.integration.elab.ssl-bundle=${HIS_ELAB_SSL_BUNDLE:mtls}
his.integration.eimg.base-url=${HIS_EIMG_URL:https://localhost:10423/fhir}
his.integration.eimg.ssl-bundle=${HIS_EIMG_SSL_BUNDLE:mtls}
