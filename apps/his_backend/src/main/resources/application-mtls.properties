# mTLS (FHIR, klient wobec serwisow e-*): aktywacja profilem `mtls`
spring.ssl.bundle.jks.fhir-client.key.alias=${MTLS_KEY_ALIAS:his}
spring.ssl.bundle.jks.fhir-client.keystore.location=${MTLS_KEYSTORE:file:./certs/keystore.p12}
spring.ssl.bundle.jks.fhir-client.keystore.password=${MTLS_KEYSTORE_PASSWORD}
spring.ssl.bundle.jks.fhir-client.keystore.type=PKCS12
spring.ssl.bundle.jks.fhir-client.truststore.location=${MTLS_TRUSTSTORE:file:./certs/truststore.p12}
spring.ssl.bundle.jks.fhir-client.truststore.password=${MTLS_TRUSTSTORE_PASSWORD}
spring.ssl.bundle.jks.fhir-client.truststore.type=PKCS12
