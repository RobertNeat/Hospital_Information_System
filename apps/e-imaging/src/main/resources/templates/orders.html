<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::section})}">
<body>
<section>
<h1 th:text="${view == 'history'} ? 'Zlecenia badań obrazowych - historia' : 'Zlecenia badań obrazowych'"></h1>
<div class="msg" th:if="${message}" th:text="${message}"></div>
<div class="err" th:if="${error}" th:text="${error}"></div>
<p class="lead" th:if="${orders.empty}" th:text="${view == 'history'} ? 'Brak zakończonych zleceń.' : 'Brak zlecen. Pojawiaja sie po utworzeniu zlecenia badania obrazowego w HIS.'"></p>
<table class="table" th:unless="${orders.empty}">
    <thead>
    <tr>
        <th>Zlecenie (id HIS)</th>
        <th>Pacjent</th>
        <th>Badanie</th>
        <th>Stan</th>
        <th>Synchronizacja z HIS</th>
        <th>Zmiana stanu</th>
        <th>Wynik</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="o : ${orders}">
        <td class="key" th:text="${o.hisOrderId}"></td>
        <td class="key" th:text="${o.patientRef}"></td>
        <td>
            <strong th:text="${o.examCode}"></strong>
            <span th:text="${o.examName}"></span>
            <div>
                <span th:text="${o.modality}"></span>
                <span th:if="${o.bodyRegion}" th:text="${o.bodyRegion}"></span>
                <span th:if="${o.laterality != null and o.laterality != 'na'}" th:text="'(' + ${o.laterality} + ')'"></span>
            </div>
            <div th:if="${o.contrast}">Z kontrastem</div>
            <div th:if="${o.priority}" th:text="'Pilnosc: ' + ${o.priority}"></div>
            <div th:if="${o.scheduledAt}" th:text="'Termin: ' + ${o.scheduledAt}"></div>
            <div th:if="${o.indication}" th:text="'Wskazanie: ' + ${o.indication}"></div>
            <div th:each="n : ${o.notes}" th:text="${n}"></div>
        </td>
        <td><span class="badge" th:text="${o.status.wire()}"></span></td>
        <td>
            <span th:text="${o.syncState}"></span>
            <div th:if="${o.syncMessage}" th:text="${o.syncMessage}"></div>
        </td>
        <td>
            <th:block th:each="t : ${targets}" th:if="${o.status.canMoveTo(t)}">
                <form method="post" th:action="@{/ui/orders/{id}/status(id=${o.hisOrderId})}">
                    <input type="hidden" name="status" th:value="${t.wire()}">
                    <button type="submit" class="btn" th:classappend="${t.name() == 'CANCELLED'} ? 'btn-danger'" th:text="${t.wire()}"></button>
                </form>
            </th:block>
            <form method="post" th:if="${o.syncState.name() == 'PENDING'}"
                  th:action="@{/ui/orders/{id}/sync(id=${o.hisOrderId})}">
                <button type="submit" class="btn">ponow wysylke do HIS</button>
            </form>
        </td>
        <td>
            <div class="result" th:each="r : ${o.results}">
                <strong th:text="${r.status.wire()}"></strong>
                <span th:text="${r.syncState}"></span>
                <span class="critical" th:if="${r.critical}">KRYTYCZNY</span>
                <div th:if="${r.syncMessage}" th:text="${r.syncMessage}"></div>
                <div th:text="'Opis: ' + ${r.findings}"></div>
                <div th:text="'Wnioski: ' + ${r.conclusion}"></div>
                <div th:text="'Radiolog: ' + ${r.radiologist}"></div>
                <form method="post" th:if="${r.syncState.name() == 'PENDING'}"
                      th:action="@{/ui/orders/{id}/results/{rid}/sync(id=${o.hisOrderId},rid=${r.id})}">
                    <button type="submit" class="btn">ponow wysylke wyniku</button>
                </form>
            </div>
            <details th:if="${o.status.acceptsResults()}">
                <summary>Wprowadz wynik</summary>
                <form method="post" th:action="@{/ui/orders/{id}/result(id=${o.hisOrderId})}">
                    <label>Status
                        <select name="status">
                            <option th:each="s : ${resultStatuses}" th:value="${s.wire()}"
                                    th:text="${s.wire()}" th:selected="${s.name() == 'FINAL'}"></option>
                        </select>
                    </label>
                    <label>Opis <textarea name="findings" rows="4"></textarea></label>
                    <label>Wnioski <textarea name="conclusion" rows="2"></textarea></label>
                    <label><input type="checkbox" name="critical" value="true"> Wynik krytyczny</label>
                    <label>Radiolog <input type="text" name="radiologist"></label>
                    <button type="submit" class="btn btn-primary">zapisz wynik</button>
                </form>
            </details>
        </td>
    </tr>
    </tbody>
</table>
</section>
</body>
</html>
