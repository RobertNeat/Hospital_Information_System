spring.application.name=e-imaging
server.port=10423

# Health (liveness/readiness) bez szczegolow
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Klient FHIR do his_backend (zmiana stanu zlecenia, wynik). Domyslnie wylaczony; compose wlacza.
# mTLS: ustaw eimaging.his.ssl-bundle na nazwe paczki spring.ssl.bundle.* (np. `server` z profilu mtls).
eimaging.his.enabled=${E_IMAGING_HIS_ENABLED:false}
eimaging.his.base-url=${E_IMAGING_HIS_URL:http://localhost:10420/fhir}
eimaging.his.service-key=${E_IMAGING_HIS_SERVICE_KEY:}
eimaging.his.connect-timeout=${E_IMAGING_HIS_CONNECT_TIMEOUT:1s}
eimaging.his.read-timeout=${E_IMAGING_HIS_READ_TIMEOUT:3s}
eimaging.his.ssl-bundle=${E_IMAGING_HIS_SSL_BUNDLE:}
