spring.application.name=e-imaging
server.port=10423

# mTLS jest domyslnie wlaczony: profil `mtls` (application-mtls.properties) dolaczany przez include.
# Wylaczenie (testy, IDE bez certyfikatow): HIS_MTLS_ENABLED=false (zmienna srodowiskowa albo -DHIS_MTLS_ENABLED=false).
spring.profiles.include=mtls-${HIS_MTLS_ENABLED:true}
spring.profiles.group.mtls-true=mtls

# Health (liveness/readiness) bez szczegolow
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Klient FHIR do his_backend (zmiana stanu zlecenia, wynik). Domyslnie wylaczony; compose wlacza.
# mTLS: profil `mtls` ustawia paczke SSL (`mtls`) i URL `https://` (certyfikat klienta z paczki).
eimaging.his.enabled=${E_IMAGING_HIS_ENABLED:false}
eimaging.his.base-url=${E_IMAGING_HIS_URL:http://localhost:10420/fhir}
eimaging.his.connect-timeout=${E_IMAGING_HIS_CONNECT_TIMEOUT:1s}
eimaging.his.read-timeout=${E_IMAGING_HIS_READ_TIMEOUT:3s}
eimaging.his.ssl-bundle=${E_IMAGING_HIS_SSL_BUNDLE:}
