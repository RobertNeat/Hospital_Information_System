spring.application.name=e-laboratory
server.port=10422

# Health (liveness/readiness) bez szczegolow
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Klient FHIR do his_backend (zmiana stanu zlecenia, wynik). Domyslnie wylaczony; compose wlacza.
# mTLS: ustaw elaboratory.his.ssl-bundle na nazwe paczki spring.ssl.bundle.* (np. `server` z profilu mtls).
elaboratory.his.enabled=${E_LABORATORY_HIS_ENABLED:false}
elaboratory.his.base-url=${E_LABORATORY_HIS_URL:http://localhost:10420/fhir}
elaboratory.his.service-key=${E_LABORATORY_HIS_SERVICE_KEY:}
elaboratory.his.connect-timeout=${E_LABORATORY_HIS_CONNECT_TIMEOUT:1s}
elaboratory.his.read-timeout=${E_LABORATORY_HIS_READ_TIMEOUT:3s}
elaboratory.his.ssl-bundle=${E_LABORATORY_HIS_SSL_BUNDLE:}
