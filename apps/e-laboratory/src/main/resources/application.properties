spring.application.name=e-laboratory
server.port=10422

# mTLS jest domyslnie wlaczony: profil `mtls` (application-mtls.properties) dolaczany przez include.
# Wylaczenie (testy, IDE bez certyfikatow): HIS_MTLS_ENABLED=false (zmienna srodowiskowa albo -DHIS_MTLS_ENABLED=false).
spring.profiles.include=mtls-${HIS_MTLS_ENABLED:true}
spring.profiles.group.mtls-true=mtls

# Health (liveness/readiness) bez szczegolow
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Klient FHIR do his_backend (zmiana stanu zlecenia, wynik). Domyslnie wylaczony; compose wlacza.
# mTLS: profil `mtls` ustawia paczke SSL (`mtls`) i URL `https://` (certyfikat klienta z paczki).
elaboratory.his.enabled=${E_LABORATORY_HIS_ENABLED:false}
elaboratory.his.base-url=${E_LABORATORY_HIS_URL:http://localhost:10420/fhir}
elaboratory.his.connect-timeout=${E_LABORATORY_HIS_CONNECT_TIMEOUT:1s}
elaboratory.his.read-timeout=${E_LABORATORY_HIS_READ_TIMEOUT:3s}
elaboratory.his.ssl-bundle=${E_LABORATORY_HIS_SSL_BUNDLE:}
