# Kanoniczny stos HIS: produkcja i lokalnie.
#  - produkcja: deploy_compose_ssh.sh kopiuje na host TYLKO ten plik (+ config.env,
#    projects.env); obrazy z rejestru, brak `build:`.
#  - lokalnie: nakładka compose.dev.yml (build, porty na loopback) + local.env:
#      docker compose -f deploy/compose.yml -f deploy/compose.dev.yml --env-file deploy/local.env up -d --build
# Wartości domyślne `:-` (obrazy/porty = projects.json) pozwalają uruchamiać stos
# bez projects.env; zgodność z projects.json pilnuje validate_projects.sh.
# Zmienne mają domyślne wartości (bez `:?`), żeby nie wywrócić `compose config` na hostach,
# których config.env nie został jeszcze uzupełniony. WYJĄTEK: hasła mTLS (`*_KEYSTORE_PASSWORD`,
# `*_TRUSTSTORE_PASSWORD`) są wymagane (`:?`) - mTLS jest domyślnie włączony i bez haseł aplikacje
# nie wystartują. Certyfikaty: `${HIS_CERTS_DIR}/<usługa>` -> `/certs` (tylko do odczytu);
# zob. scripts/gen-certs.sh i .github/pipeline_docs/production_deployment.md.
name: hospital-information-system

services:
  postgres:
    # Pull-through przez ZOT (sync z registry-1.docker.io) zamiast Docker Hub
    # bezpośrednio - patrz .github/pipeline_docs/overview.md.
    image: 192.168.1.162:5000/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${HIS_DB_NAME:?HIS_DB_NAME is required in config.env}
      POSTGRES_USER: ${HIS_DB_USER:?HIS_DB_USER is required in config.env}
      POSTGRES_PASSWORD: ${HIS_DB_PASSWORD:?HIS_DB_PASSWORD is required in config.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - his-internal

  his-frontend:
    image: ${REGISTRY:-local}/${HIS_FRONTEND_IMAGE:-hospital-information-system/his-frontend}:${IMAGE_TAG:-dev}
    restart: unless-stopped
    ports:
      - "${HIS_FRONTEND_HOST_PORT:-10400}:${HIS_FRONTEND_CONTAINER_PORT:-10400}"
    # nginx:alpine ma busybox wget; nasłuch tylko IPv4, stąd 127.0.0.1.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:${HIS_FRONTEND_CONTAINER_PORT:-10400}/ || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  his-backend:
    image: ${REGISTRY:-local}/${HIS_BACKEND_IMAGE:-hospital-information-system/his-backend}:${IMAGE_TAG:-dev}
    restart: unless-stopped
    env_file:
      - path: config.env
        required: false
    environment:
      HIS_DB_URL: jdbc:postgresql://postgres:5432/${HIS_DB_NAME:-his}
      HIS_DB_USER: ${HIS_DB_USER:-his}
      HIS_DB_PASSWORD: ${HIS_DB_PASSWORD:-his}
      HIS_LIQUIBASE_CONTEXTS: ${HIS_LIQUIBASE_CONTEXTS:-reference}
      # WYMAGANY klucz JWT (min. 32 bajty). Celowo `:-` zamiast `:?` (nie psuje
      # `compose config` na hostach bez wpisu); pusty = backend nie wystartuje.
      # Wartość musi być w config.env (produkcja) lub deploy/local.env (lokalnie).
      HIS_JWT_SECRET: ${HIS_JWT_SECRET:-}
      HIS_JWT_TTL: ${HIS_JWT_TTL:-15m}
      HIS_JWT_ISSUER: ${HIS_JWT_ISSUER:-his-backend}
      # Blokada konta po kolejnych nieudanych logowaniach.
      HIS_LOCKOUT_MAX_ATTEMPTS: ${HIS_LOCKOUT_MAX_ATTEMPTS:-5}
      HIS_LOCKOUT_DURATION: ${HIS_LOCKOUT_DURATION:-15m}
      # Listy origin (po przecinku); puste = CORS wyłączony / WebSocket tylko same-origin.
      HIS_CORS_ALLOWED_ORIGINS: ${HIS_CORS_ALLOWED_ORIGINS:-}
      HIS_WS_ALLOWED_ORIGINS: ${HIS_WS_ALLOWED_ORIGINS:-}
      # Terminologia jest opcjonalna: brak depends_on na snowstorm-lite, backend
      # działa bez niego (HIS_SNOWSTORM_ENABLED=false domyślnie).
      HIS_SNOWSTORM_URL: http://snowstorm-lite:8080/fhir
      HIS_SNOWSTORM_ENABLED: ${HIS_SNOWSTORM_ENABLED:-false}
      HIS_SNOWSTORM_CONNECT_TIMEOUT: ${HIS_SNOWSTORM_CONNECT_TIMEOUT:-2s}
      HIS_SNOWSTORM_READ_TIMEOUT: ${HIS_SNOWSTORM_READ_TIMEOUT:-5s}
      HIS_SNOWSTORM_DISPLAY_LANGUAGE: ${HIS_SNOWSTORM_DISPLAY_LANGUAGE:-pl,en}
      HIS_SNOWSTORM_MAX_PAGE_SIZE: ${HIS_SNOWSTORM_MAX_PAGE_SIZE:-100}
      # mTLS (FHIR do/z e-*): port 10424 = HTTPS z wymaganym certyfikatem klienta (tylko /fhir/**, tylko w sieci
      # his-internal); API i WebSocket dla nginx na HTTP 10420; health na porcie zarządzania (nie publikowanym).
      # Wyłączenie mTLS: HIS_MTLS_ENABLED=false (health jest wtedy na porcie 10420 - zmień też healthcheck).
      HIS_MTLS_ENABLED: ${HIS_MTLS_ENABLED:-true}
      MTLS_KEYSTORE: file:/certs/keystore.p12
      MTLS_TRUSTSTORE: file:/certs/truststore.p12
      MTLS_KEYSTORE_PASSWORD: ${HIS_BACKEND_KEYSTORE_PASSWORD:?HIS_BACKEND_KEYSTORE_PASSWORD is required (mTLS)}
      MTLS_TRUSTSTORE_PASSWORD: ${HIS_BACKEND_TRUSTSTORE_PASSWORD:?HIS_BACKEND_TRUSTSTORE_PASSWORD is required (mTLS)}
      HIS_MANAGEMENT_PORT: ${HIS_BACKEND_MANAGEMENT_PORT:-10440}
      # Klient e-receipt domyślnie wyłączony; brak depends_on na e-receipt (jego niedostępność nie blokuje
      # wystawiania recept). CN klientów dozwolonych na /fhir/**: HIS_FHIR_ALLOWED_CLIENT_CNS.
      HIS_ERECEIPT_URL: https://e-receipt:10421/fhir
      HIS_ERECEIPT_ENABLED: ${HIS_ERECEIPT_ENABLED:-false}
      HIS_ERECEIPT_CONNECT_TIMEOUT: ${HIS_ERECEIPT_CONNECT_TIMEOUT:-1s}
      HIS_ERECEIPT_READ_TIMEOUT: ${HIS_ERECEIPT_READ_TIMEOUT:-3s}
      # Klient e-laboratory (zlecenia lab, anulowanie): domyślnie wyłączony, bez depends_on.
      HIS_ELAB_URL: https://e-laboratory:10422/fhir
      HIS_ELAB_ENABLED: ${HIS_ELAB_ENABLED:-false}
      HIS_ELAB_CONNECT_TIMEOUT: ${HIS_ELAB_CONNECT_TIMEOUT:-1s}
      HIS_ELAB_READ_TIMEOUT: ${HIS_ELAB_READ_TIMEOUT:-3s}
      # Klient e-imaging (zlecenia obrazowe, anulowanie): domyślnie wyłączony, bez depends_on.
      HIS_EIMG_URL: https://e-imaging:10423/fhir
      HIS_EIMG_ENABLED: ${HIS_EIMG_ENABLED:-false}
      HIS_EIMG_CONNECT_TIMEOUT: ${HIS_EIMG_CONNECT_TIMEOUT:-1s}
      HIS_EIMG_READ_TIMEOUT: ${HIS_EIMG_READ_TIMEOUT:-3s}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - his-internal
    ports:
      - "${HIS_BACKEND_HOST_PORT:-10420}:${HIS_BACKEND_CONTAINER_PORT:-10420}"
    volumes:
      - ${HIS_CERTS_DIR:-../.certs}/his_backend:/certs:ro
    # Obraz eclipse-temurin nie ma curl/wget - curl doinstalowany w spring.Dockerfile.
    # Health na osobnym porcie zarządzania (HTTP bez TLS; port FHIR wymaga certyfikatu klienta).
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:${HIS_BACKEND_MANAGEMENT_PORT:-10440}/actuator/health/readiness > /dev/null || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # Usługi e-* są niezależne i bez portów na hoście (porty z projects.json to port FHIR z mTLS);
  # dostępne w sieci his-internal. UI (HTTP) i health (port zarządzania) mają osobne porty.
  e-receipt:
    image: ${REGISTRY:-local}/${E_RECEIPT_IMAGE:-hospital-information-system/e-receipt}:${IMAGE_TAG:-dev}
    restart: unless-stopped
    environment:
      # mTLS: port 10421 = HTTPS z wymaganym certyfikatem klienta (tylko /fhir/**); UI Thymeleaf na osobnym
      # porcie HTTP 10431 (bez certyfikatu); health na porcie zarządzania 10441 (nie publikowany). Wywołanie zwrotne
      # FHIR do his_backend używa certyfikatu z /certs (CN usługi musi być na liście HIS_FHIR_ALLOWED_CLIENT_CNS).
      SERVER_PORT: ${E_RECEIPT_CONTAINER_PORT:-10421}
      HIS_MTLS_ENABLED: ${HIS_MTLS_ENABLED:-true}
      MTLS_KEYSTORE: file:/certs/keystore.p12
      MTLS_TRUSTSTORE: file:/certs/truststore.p12
      MTLS_KEYSTORE_PASSWORD: ${E_RECEIPT_KEYSTORE_PASSWORD:?E_RECEIPT_KEYSTORE_PASSWORD is required (mTLS)}
      MTLS_TRUSTSTORE_PASSWORD: ${E_RECEIPT_TRUSTSTORE_PASSWORD:?E_RECEIPT_TRUSTSTORE_PASSWORD is required (mTLS)}
      ERECEIPT_UI_PORT: ${E_RECEIPT_UI_PORT:-10431}
      ERECEIPT_MANAGEMENT_PORT: ${E_RECEIPT_MANAGEMENT_PORT:-10441}
      ERECEIPT_HIS_URL: https://his-backend:10424/fhir
      ERECEIPT_HIS_ENABLED: ${ERECEIPT_HIS_ENABLED:-false}
      ERECEIPT_HIS_CONNECT_TIMEOUT: ${ERECEIPT_HIS_CONNECT_TIMEOUT:-1s}
      ERECEIPT_HIS_READ_TIMEOUT: ${ERECEIPT_HIS_READ_TIMEOUT:-3s}
    volumes:
      - ${HIS_CERTS_DIR:-../.certs}/e_receipt:/certs:ro
    networks:
      - his-internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:${E_RECEIPT_MANAGEMENT_PORT:-10441}/actuator/health/readiness > /dev/null || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  e-laboratory:
    image: ${REGISTRY:-local}/${E_LABORATORY_IMAGE:-hospital-information-system/e-laboratory}:${IMAGE_TAG:-dev}
    restart: unless-stopped
    environment:
      # mTLS: port 10422 = HTTPS z wymaganym certyfikatem klienta (tylko /fhir/**); UI Thymeleaf na osobnym
      # porcie HTTP 10432 (bez certyfikatu); health na porcie zarządzania 10442 (nie publikowany). Wywołanie zwrotne
      # FHIR do his_backend używa certyfikatu z /certs (CN usługi musi być na liście HIS_FHIR_ALLOWED_CLIENT_CNS).
      SERVER_PORT: ${E_LABORATORY_CONTAINER_PORT:-10422}
      HIS_MTLS_ENABLED: ${HIS_MTLS_ENABLED:-true}
      MTLS_KEYSTORE: file:/certs/keystore.p12
      MTLS_TRUSTSTORE: file:/certs/truststore.p12
      MTLS_KEYSTORE_PASSWORD: ${E_LABORATORY_KEYSTORE_PASSWORD:?E_LABORATORY_KEYSTORE_PASSWORD is required (mTLS)}
      MTLS_TRUSTSTORE_PASSWORD: ${E_LABORATORY_TRUSTSTORE_PASSWORD:?E_LABORATORY_TRUSTSTORE_PASSWORD is required (mTLS)}
      E_LABORATORY_UI_PORT: ${E_LABORATORY_UI_PORT:-10432}
      E_LABORATORY_MANAGEMENT_PORT: ${E_LABORATORY_MANAGEMENT_PORT:-10442}
      E_LABORATORY_HIS_URL: https://his-backend:10424/fhir
      E_LABORATORY_HIS_ENABLED: ${E_LABORATORY_HIS_ENABLED:-false}
      E_LABORATORY_HIS_CONNECT_TIMEOUT: ${E_LABORATORY_HIS_CONNECT_TIMEOUT:-1s}
      E_LABORATORY_HIS_READ_TIMEOUT: ${E_LABORATORY_HIS_READ_TIMEOUT:-3s}
    volumes:
      - ${HIS_CERTS_DIR:-../.certs}/e_laboratory:/certs:ro
    networks:
      - his-internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:${E_LABORATORY_MANAGEMENT_PORT:-10442}/actuator/health/readiness > /dev/null || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  e-imaging:
    image: ${REGISTRY:-local}/${E_IMAGING_IMAGE:-hospital-information-system/e-imaging}:${IMAGE_TAG:-dev}
    restart: unless-stopped
    environment:
      # mTLS: port 10423 = HTTPS z wymaganym certyfikatem klienta (tylko /fhir/**); UI Thymeleaf na osobnym
      # porcie HTTP 10433 (bez certyfikatu); health na porcie zarządzania 10443 (nie publikowany). Wywołanie zwrotne
      # FHIR do his_backend używa certyfikatu z /certs (CN usługi musi być na liście HIS_FHIR_ALLOWED_CLIENT_CNS).
      SERVER_PORT: ${E_IMAGING_CONTAINER_PORT:-10423}
      HIS_MTLS_ENABLED: ${HIS_MTLS_ENABLED:-true}
      MTLS_KEYSTORE: file:/certs/keystore.p12
      MTLS_TRUSTSTORE: file:/certs/truststore.p12
      MTLS_KEYSTORE_PASSWORD: ${E_IMAGING_KEYSTORE_PASSWORD:?E_IMAGING_KEYSTORE_PASSWORD is required (mTLS)}
      MTLS_TRUSTSTORE_PASSWORD: ${E_IMAGING_TRUSTSTORE_PASSWORD:?E_IMAGING_TRUSTSTORE_PASSWORD is required (mTLS)}
      E_IMAGING_UI_PORT: ${E_IMAGING_UI_PORT:-10433}
      E_IMAGING_MANAGEMENT_PORT: ${E_IMAGING_MANAGEMENT_PORT:-10443}
      E_IMAGING_HIS_URL: https://his-backend:10424/fhir
      E_IMAGING_HIS_ENABLED: ${E_IMAGING_HIS_ENABLED:-false}
      E_IMAGING_HIS_CONNECT_TIMEOUT: ${E_IMAGING_HIS_CONNECT_TIMEOUT:-1s}
      E_IMAGING_HIS_READ_TIMEOUT: ${E_IMAGING_HIS_READ_TIMEOUT:-3s}
    volumes:
      - ${HIS_CERTS_DIR:-../.certs}/e_imaging:/certs:ro
    networks:
      - his-internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:${E_IMAGING_MANAGEMENT_PORT:-10443}/actuator/health/readiness > /dev/null || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # Wolumen tworzony przez Docker jest własnością root, a obraz działa jako
  # uid 1000 i nie ma katalogu /app/lucene-index - bez tego Lite kończy się
  # AccessDeniedException. Jednorazowy init na tym samym obrazie (bez sieci/internetu).
  snowstorm-lite-init:
    profiles: ["terminology"]
    # Pull-through przez ZOT (sync z registry-1.docker.io) zamiast Docker Hub
    # bezpośrednio - patrz .github/pipeline_docs/overview.md.
    image: 192.168.1.162:5000/snomedinternational/snowstorm-lite:2.7.0
    user: "0:0"
    entrypoint: ["chown", "1000:1000", "/app/lucene-index"]
    restart: "no"
    network_mode: none
    volumes:
      - snowstorm-lite-data:/app/lucene-index

  # Serwer terminologii SNOMED CT (Snowstorm Lite). Opcjonalny: startuje tylko z
  # profilem `terminology` (--profile terminology lub COMPOSE_PROFILES=terminology
  # w config.env). Bez portu na hoście; dostępny dla backendu w sieci his-internal
  # (lokalnie port 127.0.0.1 dodaje compose.dev.yml).
  # Nie potrzebuje internetu. Import RF2 ręcznie - zob. production_deployment.md.
  snowstorm-lite:
    profiles: ["terminology"]
    # Tag przypięty do wydania; obraz jest wieloarchitekturowy (amd64/arm64).
    # Pull-through przez ZOT (sync z registry-1.docker.io) zamiast Docker Hub
    # bezpośrednio - patrz .github/pipeline_docs/overview.md.
    image: 192.168.1.162:5000/snomedinternational/snowstorm-lite:2.7.0
    restart: unless-stopped
    command: ["--index.path=lucene-index/data"]
    depends_on:
      snowstorm-lite-init:
        condition: service_completed_successfully
    environment:
      ADMIN_USERNAME: ${HIS_SNOWSTORM_ADMIN_USER:-admin}
      # Celowo `:-` zamiast `:?`: Compose interpoluje zmienne także dla usług
      # nieaktywnych profili, więc `:?` wywalałoby `compose config`/`up` bez profilu.
      # Domyślna wartość jest tylko zapchajdziurą - na serwerze ustawić własne hasło.
      ADMIN_PASSWORD: ${HIS_SNOWSTORM_ADMIN_PASSWORD:-admin}
    volumes:
      - snowstorm-lite-data:/app/lucene-index
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8080/fhir/metadata > /dev/null || exit 1"
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - his-internal

networks:
  his-internal:
    internal: true

volumes:
  postgres-data:
  snowstorm-lite-data:
